# .github/workflows/deploy.yml
name: Fixer Web Deploy (Auto-Healing Protocol)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Self-Healing 1 (Generate Web Core)
        run: flutter create . --platforms web

      - name: Self-Healing 2 (Purge Cache & Rebuild Dependencies)
        run: flutter clean && flutter pub get

      - name: Self-Healing 3 (Auto-Fix Syntax & Formatting)
        run: dart fix --apply || true

      - name: Build Web with Auto-Diagnostics (Resolved Base-Href)
        run: flutter build web --base-href /LIRIDGE-fixer/ --release || (echo "🚨 CRITICAL BUILD CRASH DETECTED." && flutter build web -v && exit 1)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
