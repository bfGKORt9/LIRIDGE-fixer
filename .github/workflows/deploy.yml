name: Fixer Web Deploy (Auto-Healing Protocol)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Self-Healing 1 (Generate Web Core)
        run: flutter create . --platforms web

      - name: Self-Healing 2 (Purge Cache & Rebuild Dependencies)
        # 依存関係の破損やキャッシュエラーを自動で浄化（自己修復）します
        run: flutter clean && flutter pub get

      - name: Self-Healing 3 (Auto-Fix Syntax & Formatting)
        # iPhoneでのコピペ時に発生しがちな微細な構文エラーを自動修正します
        run: dart fix --apply || true

      - name: Build Web with Auto-Diagnostics
        # ビルドに失敗した場合、AIに提出するための「超詳細な解析ログ（-v）」を自動で吐き出します
        run: flutter build web --base-href /fixer/ --release || (echo "🚨 CRITICAL BUILD CRASH DETECTED. DUMPING VERBOSE LOGS FOR AI ASSIST..." && flutter build web -v && exit 1)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
